[project]
name = "rag-eval-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush-0023", email = "ayush99coding@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.1",
    "huggingface-hub<1.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "numpy<2",
    "onnxruntime==1.22.0",
    "openai>=3.39.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers==3.0.1",
    "torch==2.2.2",
    "transformers==4.44.2",
]

[project.scripts]
rag-eval-project = "rag_eval_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
